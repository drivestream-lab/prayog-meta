apiVersion: launchpad/v1
kind: HarnessConfig
org: drivestream-lab

delivery_contract: sdd-delivery/v2
delivery_roles:
  engineering-gate: prayog-pe-team

profiles:
  meta-pm:
    skills:
      - repo: prayog-skills
        ref: v0.5.0-rc.2
    community_skills:
      - source: github/awesome-copilot
        ref: main
        skill: prd
    skill_runtimes:
      - .agents/skills
      - .claude/skills
    codeowners_template: CODEOWNERS.meta-pm
    harness_pin_template: harness-pin.meta.yaml

  python-backend:
    prayog_profile: python-backend
    constitution:
      repo: python-services-rules
      ref: v0.5.10
    skills:
      - repo: prayog-skills
        ref: v0.5.0-rc.2
    skill_runtimes:
      - .agents/skills
      - .claude/skills
    codeowners_template: CODEOWNERS.python-backend
    harness_pin_template: harness-pin.python-backend.yaml

  nextjs-frontend:
    prayog_profile: frontend
    constitution:
      repo: nextjs-bff-rules
      ref: v0.1.6
    skills:
      - repo: prayog-skills
        ref: v0.5.0-rc.2
    skill_runtimes:
      - .agents/skills
      - .claude/skills
    codeowners_template: CODEOWNERS.nextjs-frontend
    harness_pin_template: harness-pin.nextjs-frontend.yaml

# Per-repo harness overrides (optional). Default = repo stack from governance.
repos:
  gateflow: python-backend
  gateflow-ops: nextjs-frontend
