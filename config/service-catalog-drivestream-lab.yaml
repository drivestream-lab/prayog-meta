apiVersion: launchpad/v1
kind: ServiceCatalog

# Prayog programme service catalog.
# Promote gateflow / gateflow-ops from planned → live after init-client + harness green.
org: drivestream-lab

services:
  prayog-meta:
    stack: meta-pm
    description: Prayog programme control-plane — PRDs, work manifests, factory config
    status: live
    teams: [prayog-pm-team, prayog-pe-team]
    links:
      repo: https://github.com/drivestream-lab/prayog-meta

  prayog-skills:
    stack: platform-tooling
    description: Agent skills, workflow.yaml, and sdd-delivery/v2 contract SSOT
    status: live
    teams: [prayog-pe-team]
    links:
      repo: https://github.com/drivestream-lab/prayog-skills

  launchpad:
    stack: platform-tooling
    description: Launchpad factory CLI — harness sync, onboard, playbook
    status: live
    teams: [prayog-pe-team]
    links:
      repo: https://github.com/drivestream-lab/launchpad

  gateflow:
    stack: python-backend
    description: Gateflow orchestrator API — webhooks, run store, agent dispatch
    status: live
    teams: [prayog-pe-team]
    links:
      repo: https://github.com/drivestream-lab/gateflow
      docs: https://github.com/drivestream-lab/prayog-meta
      foundation: https://github.com/drivestream-lab/python-fastapi-foundation/tree/v0.3.2
      constitution: https://github.com/drivestream-lab/python-services-rules/tree/v0.5.10
      skills: https://github.com/drivestream-lab/prayog-skills/tree/v0.4.3

  gateflow-ops:
    stack: nextjs-frontend
    description: Gateflow operations console — BFF to gateflow internal API
    status: live
    teams: [prayog-pe-team]
    links:
      repo: https://github.com/drivestream-lab/gateflow-ops
      upstream: https://github.com/drivestream-lab/gateflow
      foundation: https://github.com/drivestream-lab/nextjs-bff-foundation/tree/v0.1.0
      constitution: https://github.com/drivestream-lab/nextjs-bff-rules/tree/v0.1.6
      skills: https://github.com/drivestream-lab/prayog-skills/tree/v0.4.3
