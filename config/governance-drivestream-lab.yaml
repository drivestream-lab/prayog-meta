apiVersion: launchpad/v1
kind: GovernanceConfig

# Prayog programme — drivestream-lab org.
# Day 1: meta + brownfield platform repos (prayog-skills, launchpad).
# Day N: gateflow (API) and gateflow-ops (BFF) via init-client --repo.
org: drivestream-lab

stack_profiles:
  meta-pm: Programme management & PRD meta repo
  platform-tooling: Platform SSOT repos (skills, factory CLI) — brownfield, no cookiecutter
  python-backend: Python / FastAPI microservice
  nextjs-frontend: Next.js BFF / ops portal

teams:
  - name: prayog-pm-team
    description: Product — PRD and meta develop merges
    privacy: closed
  - name: prayog-pe-team
    description: Platform engineering — delivery gates and technical review
    privacy: closed

repos:
  # ─── Day 1: meta (required) ─────────────────────────────────────────────
  prayog-meta:
    stack: meta-pm
    teams: [prayog-pm-team, prayog-pe-team]
    visibility: public
    description: Prayog programme control-plane — PRDs, factory config, impact maps

  # ─── Platform SSOT (existing on GitHub — brownfield) ─────────────────────
  prayog-skills:
    stack: platform-tooling
    teams: [prayog-pe-team]
    visibility: public
    description: Agent skills, workflow.yaml, and delivery contract SSOT

  launchpad:
    stack: platform-tooling
    teams: [prayog-pe-team]
    visibility: public
    description: Launchpad factory CLI, playbook, and harness automation

  # ─── Gateflow programme (greenfield — run init-client --repo when ready) ─
  gateflow:
    stack: python-backend
    teams: [prayog-pe-team]
    visibility: public
    description: Gateflow orchestrator API — webhooks, runs, GitHub App, agent dispatch

  gateflow-ops:
    stack: nextjs-frontend
    teams: [prayog-pe-team]
    visibility: public
    description: Gateflow operations console — runs visibility BFF upstream to gateflow

policy:
  default_branch: main
  integration_branch: develop
  require_pr_reviews: 0
  dismiss_stale_reviews: true

project_board:
  enabled: true
  name: "drivestream-lab Board"
